version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - pokesync-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - pokesync-net

  backend:
    build: .
    container_name: pokesync-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/pokesync
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET=supersecreto12345678901234567890
      - JWT_EXPIRATION=3600000
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - pokesync-net
    restart: on-failure

networks:
  pokesync-net:
